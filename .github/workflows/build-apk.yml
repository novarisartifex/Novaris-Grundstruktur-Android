name: Build Novaris Grundstruktur APK
on:
  workflow_dispatch:
  push:
    branches: [feature/v1.3-android-bootstrap]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate original source availability
        run: |
          test -s app/src/main/assets/novaris.html || {
            echo "::error::Original HTML source is missing. Do not ship a placeholder APK."
            exit 1
          }
          echo "144c3e2404e5e203e92bbc1e740d0ab3a417b36c2b20a980d7b953a686dc9696  app/src/main/assets/novaris.html" | sha256sum -c -
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Novaris-Grundstruktur-v1.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
