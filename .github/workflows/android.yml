name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || test -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Kotlin and build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: novaris-debug-apk
          path: app/build/outputs/apk/debug/*.apk
